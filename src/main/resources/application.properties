# APPLICATION
spring.application.name=GOATSPORTS-CLUB-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# GATEWAY
app.jwt.secret=${JWT_SECRET}
# SERVICE
auth.service.url=${AUTH_SERVICE_URL}
social.service.url=${SOCIAL_SERVICE_URL}
venue.service.url=${VENUE_SERVICE_URL}
payment.service.url=${PAYMENT_SERVICE_URL}
storage.service.url=${STORAGE_SERVICE_URL}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
payment.events.consumer-enabled=${PAYMENT_EVENTS_CONSUMER_ENABLED}
payment.events.topic=${PAYMENT_EVENTS_TOPIC}
payment.events.club-group-id=${PAYMENT_EVENTS_CLUB_GROUP_ID}
club.events.topic=${CLUB_EVENTS_TOPIC}
club.events.producer-enabled=${CLUB_EVENTS_PRODUCER_ENABLED}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.iuh.fit.clubservice=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId:-}] - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.max-page-size=20
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# DEMO
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}